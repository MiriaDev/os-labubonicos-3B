<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="home.css">
    <title>Loja de personalização de labubus</title>
</head>
<body>
    <header>
        Bem-vindo à Labubônicos
    </header>

    <div class="produtos">
        <div class="produto">
            <img src="https://i.pinimg.com/736x/48/58/83/48588385831359b08e43c0a376b52d19.jpg" alt="Batom">
            <h3>vestido de morango</h3>
            <p>R$ 50,00</p>
            <button class="botao-comprar">Comprar</button>
        </div>

        <div class="produto">
            <img src="https://i.pinimg.com/736x/a7/a2/60/a7a2600cf550b8ae98867f30a61bcac7.jpg" alt="Perfume">
            <h3>saia rosa</h3>
            <p>R$ 45,00</p>
            <button class="botao-comprar">Comprar</button>
        </div>

        <div class="produto">
            <img src="https://i.pinimg.com/1200x/5c/5f/e3/5c5fe301f44910ffd1d4863da0a81251.jpg" alt="Creme">
            <h3>shorts</h3>
            <p>R$ 40,00</p>
            <button class="botao-comprar">Comprar</button>
        </div>

        <div class="produto">
            <img src= "https://i.pinimg.com/736x/69/9a/32/699a3255f888fdbc100a7f3cb56eff5b.jpg" alt="Esmalte">
            <h3>Moletom de gatinho</h3>
            <p>R$ 70,00</p>
            <button class="botao-comprar">Comprar</button>
        </div>

    </div>
    <div id="carrinho" style="margin-top: 40px; background-color: #ffffff; padding: 20px; border-radius: 12px; width: 80%; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2>Seu Carrinho:</h2>
    <ul id="lista-carrinho" style="list-style: none; padding: 0;"></ul>
    <p id="total-carrinho" style="font-weight: bold; color: #fca917;">Total: R$ 0,00</p>
</div>

<script>
  const botoes = document.querySelectorAll('.botao-comprar');
  const listaCarrinho = document.getElementById('lista-carrinho');
  const totalCarrinho = document.getElementById('total-carrinho');

  let carrinho = [];
  let total = 0;

  botoes.forEach(botao => {
    botao.addEventListener('click', function() {
      const produtoCard = this.parentElement;
      const nome = produtoCard.querySelector('h3').innerText;
      const precoTexto = produtoCard.querySelector('p').innerText;
      
      const preco = parseFloat(precoTexto.replace('R$ ', '').replace(',', '.'));

      carrinho.push({ nome, preco });

      total += preco;

      atualizarCarrinho();
    });
  });

  function atualizarCarrinho() {
    listaCarrinho.innerHTML = '';

    carrinho.forEach(item => {
      const li = document.createElement('li');
      li.innerText = `${item.nome} - R$ ${item.preco.toFixed(2).replace('.', ',')}`;
      listaCarrinho.appendChild(li);
    });

    totalCarrinho.innerText = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
  }

  
</script>


</body>
</html>
